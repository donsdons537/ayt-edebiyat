<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYT Yazar-Eser Oyunu</title>
<style>
:root {
  --bg: #0d0d0f; --surface: #161618; --surface2: #1e1e22; --border: #2a2a30;
  --accent: #c9a84c; --accent2: #e8c96a; --text: #e8e4d8; --muted: #7a7568;
  --ok: #4a9e6b; --err: #c05050; --ok-bg: rgba(74,158,107,0.15); --err-bg: rgba(192,80,80,0.15);
  --halk:#7eb3d4; --divan:#c48fd4; --tanzimat:#d4a887; --servet:#87c4a8; --milli:#d4c487; --cumhuriyet:#d48787;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
h1 { font-size: 2rem; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 4px; }
header { text-align: center; margin-bottom: 24px; padding-top: 12px; }
header p { color: var(--muted); font-size: 0.9rem; font-style: italic; }
.wrap { width: 100%; max-width: 660px; }
.hidden { display: none !important; }

.grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
.grid6 { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; margin-bottom: 12px; }
.section-title { text-align: center; color: var(--muted); font-style: italic; font-size: 1rem; margin-bottom: 10px; }

.card-btn { padding: 14px 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; cursor: pointer; font-family: Georgia, serif; font-size: 0.85rem; text-align: center; transition: all 0.2s; position: relative; overflow: hidden; }
.card-btn::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
.card-btn[data-donem="halk"]::after { background: var(--halk); }
.card-btn[data-donem="divan"]::after { background: var(--divan); }
.card-btn[data-donem="tanzimat"]::after { background: var(--tanzimat); }
.card-btn[data-donem="servet"]::after { background: var(--servet); }
.card-btn[data-donem="milli"]::after { background: var(--milli); }
.card-btn[data-donem="cumhuriyet"]::after { background: var(--cumhuriyet); }
.card-btn:hover { border-color: var(--accent); background: var(--surface2); }
.card-btn.sel { border-color: var(--accent); background: rgba(201,168,76,0.1); color: var(--accent); }
.sub { display: block; font-size: 0.65rem; color: var(--muted); margin-top: 3px; font-style: italic; }
.card-btn.sel .sub { color: var(--accent); opacity: 0.7; }

.sayi-btn { padding: 10px 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; cursor: pointer; font-family: Georgia, serif; font-size: 1rem; font-weight: 700; text-align: center; transition: all 0.2s; }
.sayi-btn:hover { border-color: var(--accent); background: var(--surface2); }
.sayi-btn.sel { border-color: var(--accent); background: rgba(201,168,76,0.1); color: var(--accent); }
.sayi-sub { display: block; font-size: 0.6rem; color: var(--muted); font-style: italic; margin-top: 2px; }
.sayi-btn.sel .sayi-sub { color: var(--accent); opacity: 0.7; }

.basla { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0d0d0f; border: none; border-radius: 8px; font-family: Georgia, serif; font-size: 1.1rem; font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: all 0.25s; }
.basla:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.3); }
.basla:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.skor-bar { display: flex; justify-content: space-between; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; }
.skor-item { text-align: center; }
.skor-val { font-size: 1.3rem; font-weight: 700; color: var(--accent); line-height: 1; }
.skor-lbl { font-size: 0.68rem; color: var(--muted); margin-top: 2px; font-style: italic; }

.progress-bar { width: 100%; height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 18px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.5s; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-style: italic; margin-bottom: 10px; border: 1px solid; }

.soru-kart { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 20px; margin-bottom: 14px; text-align: center; }
.soru-ust { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.eser-adi { font-size: clamp(1.2rem, 3vw, 1.7rem); font-weight: 700; line-height: 1.3; }

.secenekler { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.sec-btn { padding: 13px 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; cursor: pointer; font-family: Georgia, serif; font-size: 0.95rem; text-align: left; display: flex; align-items: center; gap: 8px; line-height: 1.3; transition: all 0.2s; }
.harf { min-width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; transition: all 0.2s; }
.sec-btn:not(:disabled):hover { border-color: var(--accent); background: rgba(201,168,76,0.08); }
.sec-btn:not(:disabled):hover .harf { border-color: var(--accent); color: var(--accent); }
.sec-btn.dogru { border-color: var(--ok); background: var(--ok-bg); cursor: default; }
.sec-btn.dogru .harf { background: var(--ok); border-color: var(--ok); color: white; }
.sec-btn.yanlis { border-color: var(--err); background: var(--err-bg); cursor: default; opacity: 0.7; }
.sec-btn.yanlis .harf { background: var(--err); border-color: var(--err); color: white; }
.sec-btn:disabled:not(.dogru):not(.yanlis) { opacity: 0.5; cursor: default; }

.mesaj { text-align: center; padding: 12px; border-radius: 8px; font-size: 0.95rem; display: none; }
.mesaj.dogru { display: block; background: var(--ok-bg); border: 1px solid var(--ok); color: #6dd49a; }
.mesaj.yanlis { display: block; background: var(--err-bg); border: 1px solid var(--err); color: #e07070; }

.devam-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; padding: 10px 16px; background: rgba(13,13,15,0.97); border-top: 1px solid var(--border); gap: 10px; }
.devam-btn { flex: 1; padding: 13px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #0d0d0f; border-radius: 8px; font-family: Georgia, serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
.bitir-btn { flex: 0 0 auto; padding: 13px 18px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; font-family: Georgia, serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: none; }
.bitir-btn:hover { border-color: var(--accent); color: var(--accent); }

.sonuc-kart { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px 24px; margin-bottom: 16px; text-align: center; }
.sonuc-baslik { font-size: 2rem; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px; }
.sonuc-puan { font-size: 3.5rem; font-weight: 900; color: var(--accent); line-height: 1; margin: 16px 0 6px; }
.sonuc-alti { color: var(--muted); font-size: 0.9rem; font-style: italic; margin-bottom: 20px; }
.sonuc-detay { display: flex; justify-content: center; gap: 28px; margin-bottom: 20px; }
.detay-val { font-size: 1.8rem; font-weight: 700; }
.detay-val.g { color: var(--ok); }
.detay-val.r { color: var(--err); }
.detay-lbl { font-size: 0.75rem; color: var(--muted); font-style: italic; }
.sonuc-yorum { font-size: 1rem; font-style: italic; padding: 14px; border-top: 1px solid var(--border); }
.buton-row { display: flex; gap: 10px; }
.buton-row button { flex: 1; padding: 13px; border-radius: 8px; font-family: Georgia, serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.25s; }
.btn-p { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #0d0d0f; }
.btn-s { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-s:hover { border-color: var(--accent); color: var(--accent); }

#oyun { padding-bottom: 70px; }
@media(max-width:480px){ .secenekler{grid-template-columns:1fr} .grid3{grid-template-columns:1fr 1fr} .grid6{grid-template-columns:repeat(3,1fr)} }
</style>
</head>

<header>
  <h1>Yazar · Eser</h1>
  <p>AYT Türk Dili ve Edebiyatı · Hazırlık Oyunu</p>
</header>

<div class="wrap" id="menu">
  <p class="section-title">Hangi dönemden çalışmak istersiniz?</p>
  <div class="grid3">
    <button class="card-btn" data-donem="halk" onclick="donemSec(this)">Halk Edebiyatı<span class="sub">Sözlü gelenek</span></button>
    <button class="card-btn" data-donem="divan" onclick="donemSec(this)">Divan Edebiyatı<span class="sub">Klasik dönem</span></button>
    <button class="card-btn" data-donem="tanzimat" onclick="donemSec(this)">Tanzimat<span class="sub">1860–1896</span></button>
    <button class="card-btn" data-donem="servet" onclick="donemSec(this)">Servet-i Fünun<span class="sub">1896–1901</span></button>
    <button class="card-btn" data-donem="milli" onclick="donemSec(this)">Milli Edebiyat<span class="sub">1911–1923</span></button>
    <button class="card-btn" data-donem="cumhuriyet" onclick="donemSec(this)">Cumhuriyet<span class="sub">1923–günümüz</span></button>
    <button class="card-btn" data-donem="karisik" onclick="donemSec(this)" style="grid-column:1/-1">🎲 Karışık — Tüm Dönemler<span class="sub">Hepsinden rastgele</span></button>
  </div>
  <p class="section-title">Kaç soru çözmek istersiniz?</p>
  <div class="grid6">
    <button class="sayi-btn" data-sayi="10" onclick="sayiSec(this)">10<span class="sayi-sub">Kısa</span></button>
    <button class="sayi-btn" data-sayi="20" onclick="sayiSec(this)">20<span class="sayi-sub">Standart</span></button>
    <button class="sayi-btn" data-sayi="30" onclick="sayiSec(this)">30<span class="sayi-sub">Uzun</span></button>
    <button class="sayi-btn" data-sayi="40" onclick="sayiSec(this)">40<span class="sayi-sub">Maraton</span></button>
    <button class="sayi-btn" data-sayi="50" onclick="sayiSec(this)">50<span class="sayi-sub">Zorlu</span></button>
    <button class="sayi-btn" data-sayi="0" onclick="sayiSec(this)">∞<span class="sayi-sub">Sonsuz</span></button>
  </div>
  <button class="basla" id="baslaBtn" onclick="baslat()" disabled>Oyunu Başlat</button>
</div>

<div class="wrap hidden" id="oyun">
  <div class="skor-bar">
    <div class="skor-item"><div class="skor-val" id="soruNo">1/20</div><div class="skor-lbl">Soru</div></div>
    <div class="skor-item"><div class="skor-val" id="dogruNo">0</div><div class="skor-lbl">Doğru</div></div>
    <div class="skor-item"><div class="skor-val" id="yanlisNo">0</div><div class="skor-lbl">Yanlış</div></div>
    <div class="skor-item"><div class="skor-val" id="puanNo">0</div><div class="skor-lbl">Puan</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="soru-kart">
    <div class="soru-ust">Bu eserin yazarı kimdir?</div>
    <div class="badge" id="badge"></div>
    <div class="eser-adi" id="eserAdi">—</div>
  </div>
  <div class="secenekler" id="secenekler"></div>
  <div class="mesaj" id="mesaj"></div>
</div>

<div class="devam-bar" id="devamBar">
  <button class="devam-btn" onclick="sonraki()">Sonraki Soru →</button>
  <button class="bitir-btn" id="bitirBtn" onclick="sonuc()">Bitir</button>
</div>

<div class="wrap hidden" id="sonucEkran">
  <div class="sonuc-kart">
    <div class="sonuc-baslik" id="sonucBaslik">Tebrikler!</div>
    <div class="sonuc-puan" id="sonucPuan">0</div>
    <div class="sonuc-alti">puan</div>
    <div class="sonuc-detay">
      <div><div class="detay-val g" id="fDogru">0</div><div class="detay-lbl">Doğru</div></div>
      <div><div class="detay-val r" id="fYanlis">0</div><div class="detay-lbl">Yanlış</div></div>
      <div><div class="detay-val" id="fYuzde" style="color:var(--accent)">0%</div><div class="detay-lbl">Başarı</div></div>
    </div>
    <div class="sonuc-yorum" id="sonucYorum"></div>
  </div>
  <div class="buton-row">
    <button class="btn-s" onclick="menu()">Ana Menü</button>
    <button class="btn-p" onclick="baslat()">Tekrar Oyna</button>
  </div>
</div>

var LABEL = {halk:"Halk Edebiyati",divan:"Divan Edebiyati",tanzimat:"Tanzimat",servet:"Servet-i Funun",milli:"Milli Edebiyat",cumhuriyet:"Cumhuriyet",karisik:"Karisik"};
var RENK = {halk:"var(--halk)",divan:"var(--divan)",tanzimat:"var(--tanzimat)",servet:"var(--servet)",milli:"var(--milli)",cumhuriyet:"var(--cumhuriyet)",karisik:"var(--accent)"};
var HARF = ["A","B","C","D"];

var donem=null, sayi=null, sorular=[], idx=0, dogru=0, yanlis=0, puan=0, cevaplandi=false, sonsuz=false;

function donemSec(btn) {
  document.querySelectorAll(".card-btn").forEach(function(b){b.classList.remove("sel");});
  btn.classList.add("sel");
  donem = btn.getAttribute("data-donem");
  kontrol();
}
function sayiSec(btn) {
  document.querySelectorAll(".sayi-btn").forEach(function(b){b.classList.remove("sel");});
  btn.classList.add("sel");
  sayi = parseInt(btn.getAttribute("data-sayi"));
  kontrol();
}
function kontrol() {
  document.getElementById("baslaBtn").disabled = !(donem && sayi !== null);
}
function getYazarlar(d) {
  if(d === "karisik") {
    var tum = [];
    Object.keys(VERI).forEach(function(k){ tum = tum.concat(VERI[k]); });
    return tum;
  }
  return VERI[d] || [];
}
function karistir(arr) {
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function soruYap(d) {
  var havuz = getYazarlar(d);
  var dg = havuz[Math.floor(Math.random()*havuz.length)];
  var eser = dg.e[Math.floor(Math.random()*dg.e.length)];
  var yanlis = karistir(havuz.filter(function(x){return x.y!==dg.y;})).slice(0,3).map(function(x){return x.y;});
  var secenekler = karistir([dg.y].concat(yanlis));
  var dd = d;
  if(d==="karisik"){
    Object.keys(VERI).forEach(function(k){
      if(VERI[k].some(function(x){return x.y===dg.y;})) dd=k;
    });
  }
  return {eser:eser, dogru:dg.y, secenekler:secenekler, donem:dd};
}
function baslat() {
  if(!donem || sayi===null) return;
  sonsuz = sayi===0;
  var hedef = sonsuz ? 50 : sayi;
  sorular = [];
  var kullanilan = {};
  var deneme = 0;
  while(sorular.length < hedef && deneme < hedef*25) {
    deneme++;
    var s = soruYap(donem);
    if(!kullanilan[s.eser]) { kullanilan[s.eser]=true; sorular.push(s); }
  }
  idx=0; dogru=0; yanlis=0; puan=0; cevaplandi=false;
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("sonucEkran").classList.add("hidden");
  document.getElementById("oyun").classList.remove("hidden");
  goster();
}
function goster() {
  if(!sonsuz && idx>=sorular.length){sonuc();return;}
  cevaplandi=false;
  var s = sorular[idx];
  document.getElementById("progress").style.width = (sonsuz?0:(idx/sorular.length)*100)+"%";
  document.getElementById("soruNo").textContent = sonsuz?(idx+1)+"/ ∞":(idx+1)+"/"+sorular.length;
  document.getElementById("dogruNo").textContent = dogru;
  document.getElementById("yanlisNo").textContent = yanlis;
  document.getElementById("puanNo").textContent = puan;
  var badge = document.getElementById("badge");
  badge.textContent = LABEL[s.donem];
  badge.style.color = RENK[s.donem];
  badge.style.borderColor = RENK[s.donem];
  document.getElementById("eserAdi").textContent = s.eser;
  var kont = document.getElementById("secenekler");
  kont.innerHTML = "";
  s.secenekler.forEach(function(y,i){
    var btn = document.createElement("button");
    btn.className = "sec-btn";
    btn.innerHTML = "<span class='harf'>"+HARF[i]+"</span> "+y;
    btn.onclick = (function(b,y2,d2){return function(){cevapVer(b,y2,d2);};})(btn,y,s.dogru);
    kont.appendChild(btn);
  });
  document.getElementById("mesaj").className = "mesaj";
  document.getElementById("mesaj").textContent = "";
  document.getElementById("devamBar").style.display = "none";
  document.getElementById("bitirBtn").style.display = "none";
}
function cevapVer(secilen, secilenYazar, dogruYazar) {
  if(cevaplandi) return;
  cevaplandi = true;
  document.querySelectorAll(".sec-btn").forEach(function(btn){
    btn.disabled = true;
    var metin = btn.textContent.replace(/^[ABCD]\s*/,"").trim();
    if(metin === dogruYazar) btn.classList.add("dogru");
  });
  var msg = document.getElementById("mesaj");
  if(secilenYazar === dogruYazar) {
    secilen.classList.add("dogru");
    dogru++; puan+=5;
    msg.className = "mesaj dogru";
    msg.innerHTML = "Dogru! " + dogruYazar;
  } else {
    secilen.classList.add("yanlis");
    yanlis++;
    msg.className = "mesaj yanlis";
    msg.innerHTML = "Yanlis. Dogru cevap: " + dogruYazar;
  }
  document.getElementById("devamBar").style.display = "flex";
  if(sonsuz) document.getElementById("bitirBtn").style.display = "block";
}
function sonraki() {
  idx++;
  if(!sonsuz && idx>=sorular.length){sonuc();}
  else if(sonsuz){sorular.push(soruYap(donem));goster();}
  else{goster();}
}
function sonuc() {
  document.getElementById("oyun").classList.add("hidden");
  document.getElementById("devamBar").style.display="none";
  document.getElementById("sonucEkran").classList.remove("hidden");
  var toplam = idx || sorular.length;
  var yuzde = Math.round((dogru/toplam)*100);
  document.getElementById("fDogru").textContent = dogru;
  document.getElementById("fYanlis").textContent = yanlis;
  document.getElementById("fYuzde").textContent = yuzde+"%";
  document.getElementById("sonucPuan").textContent = puan;
  var b = ["Devam Et!","Gelisiyor!","Cok Iyi!","Mukemmel!"];
  var m = ["Yazarlari ve eserleri tekrar gozden gecir.","Temel bilgin var, biraz daha pratik yap.","Guclu bilgin var, birka tekrarla mukemmellesirsin.","Turk edebiyatina hakimsin, AYT'de bu konudan tam puan alirsin!"];
  var i2 = yuzde>=90?3:yuzde>=70?2:yuzde>=50?1:0;
  document.getElementById("sonucBaslik").textContent = b[i2];
  document.getElementById("sonucYorum").textContent = m[i2];
}
function menu() {
  document.getElementById("oyun").classList.add("hidden");
  document.getElementById("sonucEkran").classList.add("hidden");
  document.getElementById("devamBar").style.display="none";
  document.getElementById("menu").classList.remove("hidden");
  donem=null; sayi=null;
  document.querySelectorAll(".card-btn,.sayi-btn").forEach(function(b){b.classList.remove("sel");});
  document.getElementById("baslaBtn").disabled=true;
}
</script>
